name: CI

on:
  push:
    branches: [main, folgarever]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (compilar y probar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (TypeScript)
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

  frontend:
    name: Frontend (compilar y probar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (producción)
        run: npm run build

      - name: Pruebas unitarias
        run: npm test -- --watch=false
