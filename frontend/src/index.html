<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sistema de Inventario — Control de productos y existencias</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Sistema de gestión y control de inventario: productos, categorías, proveedores y movimientos de compra, venta y ajuste.">
  <meta name="theme-color" content="#000000">
  <!-- PWA: permite instalar la app en el movil (manifest, iconos y barra de estado). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <!-- Favicon de la marca (zorro): version clara u oscura segun el tema del sistema. -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-claro.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-oscuro.png" media="(prefers-color-scheme: dark)">
  <!-- Tipografia Inter (Sistema Visual Uber) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Aplica el tema guardado antes de cargar la aplicacion para evitar un
       destello del tema claro. La preferencia se guarda en localStorage. -->
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('sistema_inventario_tema');
        if (tema !== 'light' && tema !== 'dark') {
          tema =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', tema);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
