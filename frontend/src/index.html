<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sistema de Inventario — Control de productos y existencias</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Sistema de gestión y control de inventario: productos, categorías, proveedores y movimientos de compra, venta y ajuste.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Tipografia Inter (Sistema Visual Uber) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Aplica el tema guardado antes de cargar la aplicacion para evitar un
       destello del tema claro. La preferencia se guarda en localStorage. -->
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('sistema_inventario_tema');
        if (tema !== 'light' && tema !== 'dark') {
          tema =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', tema);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
